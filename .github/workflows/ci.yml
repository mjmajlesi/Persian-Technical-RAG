# Contract and integration suites are excluded: live tests use a Windows-specific
# server path and may require prepared indexes, embedding models or a live LLM.
# The opt-in model-card smoke test is also excluded.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-tests-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q src
      - name: Ingest and verify chunk counts
        run: |
          for lang in c cpp python java; do
            python -m src.ingest --lang "$lang"
          done
          python - <<'PY'
          from pathlib import Path
          for lang, expected in {"c": 503, "cpp": 201, "python": 253, "java": 73}.items():
              with (Path("data/index") / lang / "chunks.jsonl").open(encoding="utf-8") as chunks:
                  actual = sum(1 for _ in chunks)
              print(f"{lang}: {actual}/{expected}")
              if actual != expected:
                  raise SystemExit(f"Unexpected chunk count for {lang}")
          PY
      # Historical v1 calibration and research chunk hashes were recorded on CRLF
      # bytes in 2026, while v2 hashes used LF. Reconstruct only the recorded byte
      # state in the workspace: tracked Git blobs are not changed or committed,
      # and the conversion is semantically neutral for JSON consumers.
      - name: Restore recorded CRLF byte state for legacy hash inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for lang in ('c', 'cpp', 'python', 'java'):
              for path in (Path(f'data/eval/{lang}/eval-set.{lang}.v1.json'),
                           Path(f'data/index/{lang}/chunks.jsonl')):
                  data = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\r', b'\n')
                  text = data.decode('utf-8')
                  if path.suffix == '.jsonl':
                      for line in text.splitlines():
                          if line.strip():
                              json.loads(line)
                  else:
                      json.loads(text)
                  path.write_bytes(data.replace(b'\n', b'\r\n'))
                  print(f'Restored CRLF: {path}')
          PY
      # These ten tests require real faiss.index files for the packs;
      # they run locally, not in CI: this is a known coverage boundary.
      - name: Run unit tests
        run: >-
          python -B -m pytest -p no:cacheprovider tests/unit -q
          -k "not test_real_index_loads_without_model_or_rebuild and not test_real_languages_api_remains_ready and not test_empty_item_set_scores_as_zeroed_report and not test_contamination_item_scored_in_report and not test_dedicated_contamination_set_keeps_main_metrics_separate and not test_model_errors_mark_report_incomplete and not test_per_pack_report_reports_language_id"

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-browser-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser logic checks
        run: |
          for test in tests/browser/*.js; do
            node "$test"
          done
