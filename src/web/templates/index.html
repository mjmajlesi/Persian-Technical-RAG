<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پرسش‌وجوی فنی فارسی C</title>
<style>
  body { font-family: Tahoma, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  #answer-pane { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; min-height: 4rem; }
  .cite-chip { display: inline-block; border: 1px solid #468; border-radius: 1rem;
               padding: 0.1rem 0.7rem; margin: 0.2rem; cursor: pointer; font-size: 0.85rem; }
  .topic-chip { display: inline-block; border: 1px dashed #484; border-radius: 1rem;
               padding: 0.1rem 0.7rem; margin: 0.2rem; cursor: pointer; font-size: 0.85rem; }
  #message { color: #a00; margin-top: 1rem; }
  textarea { width: 100%; min-height: 4rem; }
</style>
</head>
<body>
<h1>پرسش‌وجوی فنی فارسی C</h1>
<form id="ask-form">
  <textarea id="question-box" placeholder="سوال فنی C را به فارسی بنویسید…"></textarea>
  <br>
  <button type="submit">بپرس</button>
</form>
<div id="message"></div>
<div id="answer-pane"></div>
<div id="citations"></div>
<script src="/static/app.js"></script>
</body>
</html>
